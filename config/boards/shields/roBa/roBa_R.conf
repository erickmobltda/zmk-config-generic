CONFIG_ZMK_KEYBOARD_NAME="roBa"

CONFIG_ZMK_MOUSE=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y

# Sleep after 30 mins idle. Wake-on-keypress needs the QSPI flash disabled
# (see &qspi in roBa.dtsi).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000


CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_PMW3610=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_ENDPOINT_RATE_NOTIFY=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n 

CONFIG_ZMK_USB=y

# Issue #3381: sub-7.5ms low-latency BLE split (central side)
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_CONN_INTERVAL_LOW_LATENCY=y
CONFIG_BT_CONN_PARAM_ANY=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n

# Trackball lag over BLE (bt-zmk-0.3, commit 001b965). ZMK defaults
# BT_PERIPHERAL_PREF_LATENCY to 30, letting this half skip 30 connection events.
# Over USB there is no lag, which puts it on the central<->host link.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
