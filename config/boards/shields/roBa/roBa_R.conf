CONFIG_ZMK_KEYBOARD_NAME="roBa"

CONFIG_ZMK_MOUSE=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y

# Sleep after 30 mins idle. Wake-on-keypress only works with the QSPI flash
# disabled (see &qspi in roBa.dtsi) -- do not re-enable it.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000


CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_PMW3610=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n 

CONFIG_ZMK_USB=y

# Trackball lag over BLE. ZMK defaults BT_PERIPHERAL_PREF_LATENCY to 30
# (app/Kconfig), which lets this half skip up to 30 connection events. At the
# 7.5-15ms interval that is 225-450ms of authorised silence -- fine for a
# keyboard, suspect for a pointing device. Over USB the trackball has no lag at
# all, which puts the problem on the central<->host BLE link.
#
# The upstream fix (CONFIG_BT_CTLR_CONN_INTERVAL_LOW_LATENCY) does not exist in
# sdk-zephyr v3.5.99-ncs1, which this build uses; it needs the newer base.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
