# Branch esb-dongle-test: charlesmst/main (ESB + dongle) running the roBa keymap
# from bt-zmk-0.3. Trimmed to the roBakesb targets; the other keyboards in the
# upstream build.yaml (charybdis, corne, lariska, prospector) are left out.
#
# Only one dongle variant gets flashed -- the one matching the dongle hardware.
# Every part (dongle + both halves) must run firmware from the same build:
# split-esb v0.8.6 changed the wire format between dongle and halves.
---
include:
  # Dongles (pick the one matching the hardware)
  - board: holyiot_dongle_1k
    shield: roBakesb
    snippet: studio-rpc-usb-uart
    artifact-name: roBakesb_dongle_holyiot

  - board: nice_nano@2.0.0//zmk
    shield: roBakesb
    snippet: studio-rpc-usb-uart
    artifact-name: roBakesb_dongle

  - board: nrf52840_mdk_dongle
    shield: roBakesb
    snippet: studio-rpc-usb-uart
    artifact-name: roBakesb_dongle_mdk

  # Halves (XIAO nRF52840)
  - board: xiao_ble//zmk
    shield: roBakesb_left
    artifact-name: roBakesb_left

  - board: xiao_ble//zmk
    shield: roBakesb_right
    artifact-name: roBakesb_right

  # Settings reset: halves, and each dongle variant (clears a keymap saved by
  # ZMK Studio, which would otherwise override the compiled one)
  - board: xiao_ble//zmk
    shield: settings_reset

  - board: holyiot_dongle_1k
    shield: settings_reset
    artifact-name: settings_reset_dongle_holyiot

  - board: nice_nano@2.0.0//zmk
    shield: settings_reset
    artifact-name: settings_reset_dongle_nice_nano

  - board: nrf52840_mdk_dongle
    shield: settings_reset
    artifact-name: settings_reset_dongle_mdk
